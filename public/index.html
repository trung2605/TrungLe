      <article style="max-width: 860px; margin: 2rem auto; padding: 1.5rem; font-family: sans-serif; line-height: 1.6;">
        <h1>Lê Trí Trung — Founder, Head of Technology, Technical BA &amp; Software Architect</h1>
        <p>
          Founder &amp; Head of Technology tại <strong>SynapForge Venture Studio</strong> (Đà Nẵng, Việt Nam). Chuyên sâu phân tích nghiệp vụ phần mềm theo chuẩn quốc tế <strong>Karl Wiegers (370+ Atomic Functional Requirements)</strong>, kiến trúc hệ thống <strong>Clean Architecture (.NET 8 &amp; Java 21 Spring Boot 3)</strong>, <strong>SaaS Automation</strong> và <strong>AI Engineering</strong>.
        </p>
        <h2>Thành Tựu &amp; Học Vấn Nổi Bật</h2>
        <ul>
          <li>Quán quân (Winner) Hackathon Computer Vision 2026 (FPT Education × SIT Singapore)</li>
          <li>Đồng tác giả bài báo khoa học quốc tế ICTA 2026 (ThreadLearn: Qwen2.5-Coder 1.5B QLoRA + BM25 AST RAG)</li>
          <li>Cử nhân Kỹ thuật Phần mềm — Đại học FPT Đà Nẵng (GPA 3.3/4.0 · 8.2/10.0), IELTS Academic 6.0</li>
          <li>Đại diện Trao đổi Sinh viên Quốc tế tại TAR UMT Kuala Lumpur, Malaysia (12/2023)</li>
          <li>Cựu Thực tập sinh Kỹ sư Phần mềm tại FPT Software Đà Nẵng (OutSystems Reactive Web)</li>
        </ul>
        <h2>Các Dự Án Thực Chiến Chủ Lực</h2>
        <ul>
          <li><strong>Biensovip.com:</strong> Sàn đấu giá &amp; định giá biển số đẹp Quốc gia (.NET 8 Clean Architecture, 61 bảng PostgreSQL &lt;8ms GIN Index, 1,1+ triệu bản ghi đấu giá VPA, 4-Tab FSM, TikTok Live 9:16 Studio, VietQR Webhook &lt;0.5s, 57 Use Cases &amp; 85 Business Rules).</li>
          <li><strong>BrandHub (brandhub.id.vn):</strong> Hệ thống 7 Microservices xuất bản đa kênh bằng AI (Spring Cloud Gateway, Java 21, RabbitMQ DLQ 0% loss rate, GraphRAG Neo4j + ChromaDB, 141 Atomic FRs, ứng dụng di động React Native 79 màn hình, 2.500+ Test Cases &amp; 320+ bộ Playwright E2E).</li>
          <li><strong>The MC Hub:</strong> Nền tảng luyện giọng nói AI thương mại hóa từ tháng đầu (87 MC chuyên nghiệp, 10-Metric Acoustic DSP &amp; Whisper Engine, 116 Atomic FRs, 47 Controllers, 51 MongoDB Collections).</li>
          <li><strong>Live TikTok 3D Interactive Game Ecosystem:</strong> Hệ sinh thái 12 game 3D tương tác TikTok Live 9:16 thời gian thực (Cúng Chùa Online 3D, Cuộc Đua Kỳ Thú 3D, AdminTong 21 biểu đồ ApexCharts, 193/193 bài kiểm thử tự động).</li>
          <li><strong>Job Finder:</strong> Hệ sinh thái tuyển dụng AI 3 tầng (Spring Boot 3, Elasticsearch 8.x, PayOS Webhook, FastAPI BERT/Gemini, 56 Atomic FRs).</li>
        </ul>
